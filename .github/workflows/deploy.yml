name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

# Serialize deploys: a newer successful CI run cancels any in-flight deploy,
# so an obsolete commit can never be deployed after a newer one supersedes it.
concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to EC2/VPS
    # Only deploy when:
    #   - the completed CI run succeeded,
    #   - the CI run was against the main branch,
    #   - the head SHA is still the tip of main (no newer commit has landed).
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            # drone-ssh runs a non-interactive shell with a minimal PATH, but
            # docker on this host lives outside it ("docker: command not found").
            # Add the usual Docker locations (snap included) up front.
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin:$PATH"

            # Production checkout is /opt/ticketing/app. Prefer it; fall back to
            # locating deploy.sh (repo root) so a moved checkout still works.
            APP_DIR="/opt/ticketing/app"
            [ -f "$APP_DIR/deploy.sh" ] || \
              APP_DIR="$(find -L /opt /srv /var/www /home -maxdepth 3 -name deploy.sh -printf '%h\n' 2>/dev/null | head -n1)"
            if [ -z "$APP_DIR" ] || [ ! -f "$APP_DIR/deploy.sh" ]; then
              echo "Deploy aborted: no deploy.sh found under /opt /srv /var/www /home."
              exit 1
            fi
            echo "Using APP_DIR=${APP_DIR}"
            cd "$APP_DIR"
            CI_SHA="${{ github.event.workflow_run.head_sha }}"

            echo "=== DEPLOY START (CI SHA: ${CI_SHA}) ==="

            # Fail closed: do not deploy if this SHA is no longer an ancestor of
            # origin/main. A newer push has superseded the CI that triggered
            # this deploy, so running deploy.sh would roll forward to unknown code.
            git fetch origin
            if [ "$(git rev-parse origin/main)" != "${CI_SHA}" ] && \
               ! git merge-base --is-ancestor "${CI_SHA}" origin/main; then
              echo "Deploy aborted: CI SHA ${CI_SHA} is not the tip of origin/main."
              exit 1
            fi

            ./deploy.sh
            echo "=== DEPLOY SUCCESS ==="
