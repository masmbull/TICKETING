; PHP-FPM reads this per-directory (PHP_INI_PERDIR). Keeps upload limit in
; lockstep with nginx `client_max_body_size 20M` and the Laravel rule
; `attachments.* => max:10240` (10MB per file). Defaults (2M/8M) were the
; real cause of >1MB uploads being rejected.
upload_max_filesize = 10M
post_max_size = 20M