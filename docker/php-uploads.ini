; PHP upload limits for the app (php-fpm). Mount into the app container at
; /usr/local/etc/php/conf.d/zz-uploads.ini, or RUN this content during image
; build. Keeps uploads in lockstep with nginx client_max_body_size 20M and the
; Laravel rule attachments.* => max:10240 (10MB per file).
upload_max_filesize = 10M
post_max_size = 20M